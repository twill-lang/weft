name = "weft"
version = "0.1.0"
entry = "src/chart.tw"

# twill used to be listed here because weft imported twill's own `src/term/`
# modules by file path, out of the vendored copy. It does not any more: those
# modules are `std/term/...` as of twill 1.7 and are compiled into the binary,
# and a working checkout has no `twill_modules/` in it.
#
# The entry stays because the floor is real. `src/scale.tw` and
# `src/heatmap.tw` return a tuple, which arrived in 1.12.0, and the glyph
# tables are `const`, which arrived in 1.10.0, so `^1.12.0` is the minimum this
# code actually compiles under. The pin follows the twill release past that
# floor, so it reads `^1.13.0`; 1.12.0 stays the real floor. See the note in
# README.md and docs/needs.md.
[dependencies]
twill = { version = "^1.13.0", git = "https://github.com/twill-lang/twill" }
